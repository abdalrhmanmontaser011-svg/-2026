<!DOCTYPE html>
<html>
<head>
    <title>اختبار Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>🧪 اختبار Firebase</h1>
    <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:90%;padding:10px;margin:5px;">
    <input type="password" id="pass" placeholder="كلمة المرور" style="width:90%;padding:10px;margin:5px;">
    <button onclick="signup()" style="padding:10px 20px;margin:5px;">إنشاء حساب</button>
    <button onclick="login()" style="padding:10px 20px;margin:5px;">تسجيل دخول</button>
    <div id="msg" style="margin:10px;color:blue;font-weight:bold;"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIpFytzg22I0AK0VjBSA0HcToqwwU4iBk",
            authDomain: "the-comprehensive-platfo-a05da.firebaseapp.com",
            projectId: "the-comprehensive-platfo-a05da",
            storageBucket: "the-comprehensive-platfo-a05da.firebasestorage.app",
            messagingSenderId: "278383446638",
            appId: "1:278383446638:web:045202a9781a6098c6f47f"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function signup() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => document.getElementById('msg').innerHTML = '✅ تم إنشاء الحساب!')
                .catch(err => document.getElementById('msg').innerHTML = '❌ ' + err.message);
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => document.getElementById('msg').innerHTML = '✅ تم تسجيل الدخول!')
                .catch(err => document.getElementById('msg').innerHTML = '❌ ' + err.message);
        }
    </script>
</body>
</html>
